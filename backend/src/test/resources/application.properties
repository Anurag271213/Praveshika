spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=test-secret-change-me-test-secret-change-me-test-secret-change-me-test
app.jwt.expiration-ms=3600000
app.jwt.issuer=login-feature-backend-test

app.admin.username=testadmin
app.admin.email=testadmin@example.com
app.admin.password=Test@123456

logging.level.root=WARN
logging.level.com.loginfeature=INFO
